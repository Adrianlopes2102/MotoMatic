<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha - MotoTrack Pro</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #f97316, #ef4444, #eab308);
        display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      .card {
        background: white; border-radius: 12px; padding: 32px;
        width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      }
      .logo { text-align: center; margin-bottom: 24px; }
      .logo svg { width: 48px; height: 48px; color: #ea580c; }
      h1 { font-size: 24px; font-weight: 700; color: #1e293b; text-align: center; }
      p.sub { color: #64748b; text-align: center; margin-top: 4px; font-size: 14px; }
      .form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
      label { font-size: 14px; font-weight: 500; color: #334155; display: block; margin-bottom: 4px; }
      input {
        width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1;
        border-radius: 8px; font-size: 14px; outline: none;
      }
      input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.15); }
      button {
        width: 100%; padding: 12px; background: #f97316; color: white;
        border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
        cursor: pointer; transition: background 0.2s;
      }
      button:hover { background: #ea580c; }
      button:disabled { background: #94a3b8; cursor: not-allowed; }
      .info-box {
        background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px;
        padding: 10px 14px; font-size: 12px; color: #c2410c;
        display: flex; align-items: center; gap: 8px;
      }
      .error-box {
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
        padding: 16px; text-align: center;
      }
      .error-box svg { width: 48px; height: 48px; color: #ef4444; margin: 0 auto 12px; display: block; }
      .error-box p { color: #991b1b; font-weight: 600; margin-bottom: 8px; }
      .error-box span { color: #64748b; font-size: 13px; }
      .success-box { text-align: center; padding: 16px; }
      .success-box svg { width: 64px; height: 64px; color: #22c55e; margin: 0 auto 12px; display: block; }
      .success-box p { color: #15803d; font-weight: 600; font-size: 18px; margin-bottom: 8px; }
      .success-box span { color: #64748b; font-size: 13px; }
      .spinner {
        text-align: center; padding: 24px;
      }
      .spinner-icon {
        width: 40px; height: 40px; border: 3px solid #fed7aa;
        border-top-color: #f97316; border-radius: 50%;
        animation: spin 0.8s linear infinite; margin: 0 auto 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .back-link {
        display: block; text-align: center; margin-top: 12px;
        font-size: 12px; color: #94a3b8; cursor: pointer;
        background: none; border: none; text-decoration: underline;
      }
      .back-link:hover { color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#ea580c">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
      </div>
      <h1>MotoTrack Pro</h1>
      <p class="sub">Redefinição de senha</p>
      <div id="content">
        <div class="spinner">
          <div class="spinner-icon"></div>
          <p style="color:#94a3b8;font-size:14px">Verificando seu link...</p>
        </div>
      </div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

      const SUPABASE_URL = 'https://kudiajqsltmbizltcpdp.supabase.co'
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1ZGlhanFzbHRtYml6bHRjcGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNzQ2MTgsImV4cCI6MjA5Mzg1MDYxOH0.nNrU31Jaj_OZK90pwf8gFOd3fE7l9S5-nMwewm0y-14'
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

      const content = document.getElementById('content')

      function showError(msg) {
        content.innerHTML = `
          <div class="error-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <p>Link inválido ou expirado</p>
            <span>${msg || 'Solicite um novo link de recuperação.'}</span>
            <button style="margin-top:16px" onclick="location.href='https://www.mototrackpro.com.br/login'">Voltar para o login</button>
          </div>`
      }

      function showForm() {
        content.innerHTML = `
          <div class="form" id="reset-form">
            <div class="info-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Digite sua nova senha abaixo. Mínimo de 6 caracteres.
            </div>
            <div>
              <label for="pw">Nova Senha</label>
              <input type="password" id="pw" placeholder="••••••••" minlength="6" required />
            </div>
            <div>
              <label for="pw2">Confirmar Nova Senha</label>
              <input type="password" id="pw2" placeholder="••••••••" minlength="6" required />
            </div>
            <button id="btn-save" onclick="doReset()">Salvar nova senha</button>
            <button class="back-link" onclick="location.href='https://www.mototrackpro.com.br/login'">Voltar para o login</button>
          </div>`
      }

      function showSuccess() {
        content.innerHTML = `
          <div class="success-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p>Senha redefinida!</p>
            <span>Você será redirecionado para o login em instantes...</span>
          </div>`
        setTimeout(() => { location.href = 'https://www.mototrackpro.com.br/login' }, 3000)
      }

      window.doReset = async function() {
        const pw = document.getElementById('pw').value
        const pw2 = document.getElementById('pw2').value
        const btn = document.getElementById('btn-save')

        if (pw !== pw2) { alert('As senhas não coincidem.'); return }
        if (pw.length < 6) { alert('A senha deve ter pelo menos 6 caracteres.'); return }

        btn.disabled = true
        btn.textContent = 'Salvando...'

        const { error } = await supabase.auth.updateUser({ password: pw })
        if (error) {
          btn.disabled = false
          btn.textContent = 'Salvar nova senha'
          alert('Erro ao redefinir: ' + error.message)
        } else {
          showSuccess()
        }
      }

      // Processa o token da URL
      async function init() {
        const hash = new URLSearchParams(location.hash.replace('#', ''))
        const query = new URLSearchParams(location.search)

        const tokenHash = hash.get('token_hash') || query.get('token_hash')
        const type = hash.get('type') || query.get('type')
        const accessToken = hash.get('access_token') || query.get('access_token')
        const refreshToken = hash.get('refresh_token') || query.get('refresh_token')

        if (tokenHash && type === 'recovery') {
          const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' })
          if (error) showError('Link inválido ou expirado.')
          else showForm()
          return
        }

        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
          if (error) showError('Link inválido ou expirado.')
          else showForm()
          return
        }

        showError('Link de recuperação não reconhecido. Solicite um novo.')
      }

      init()
    </script>
  </body>
</html>
